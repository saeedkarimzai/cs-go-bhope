<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CS Bhop</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;font-family:Arial,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 3px #000}#speed{position:absolute;left:24px;bottom:24px;font-size:30px;font-weight:800}#timer{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:26px;font-weight:800}#best{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-size:14px;color:#ddd}#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}#cross:before{width:2px;height:18px;left:8px;top:0}#cross:after{height:2px;width:18px;left:0;top:8px}#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin-top:62px;background:#000b;padding:10px 15px;border-radius:8px;font-size:14px;text-align:center;white-space:nowrap}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1a2430,#05070a 68%);z-index:5}.panel{width:min(540px,90vw);padding:32px;border:1px solid #3c4652;background:#0b1017f2;border-radius:14px;box-shadow:0 20px 80px #000}h1{margin:0 0 8px;font-size:44px;letter-spacing:3px}h2{font-size:34px;margin:0 0 8px}p{color:#b9c1cb;line-height:1.5}button{border:0;border-radius:8px;padding:13px 22px;background:#e5a11a;color:#111;font-weight:900;font-size:16px;cursor:pointer}button:hover{filter:brightness(1.12)}kbd{background:#222b35;border:1px solid #46515e;border-radius:4px;padding:2px 6px}#finish{display:none}.center{text-align:center}.small{font-size:13px;color:#8f99a5}</style></head><body><canvas id="game"></canvas><div id="hud"><div id="timer">0.00</div><div id="best"></div><div id="speed">0 u/s</div><div id="cross"></div><div id="hint">Click to lock mouse · WASD move · SPACE jump · R restart · ESC unlock</div></div><div id="menu" class="overlay"><div class="panel"><h1>CS BHOP</h1><p>Classic-style bunny hopping in one HTML file. Keep your speed, air-strafe, and land on the next platform.</p><p><kbd>W A S D</kbd> move &nbsp; <kbd>SPACE</kbd> jump &nbsp; <kbd>R</kbd> restart</p><button id="play">PLAY</button><p class="small">No API. No libraries. Runs directly in Chrome.</p></div></div><div id="finish" class="overlay"><div class="panel center"><h2>RUN COMPLETE</h2><p id="finishText"></p><button id="again">RUN AGAIN</button></div></div><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,DPR=1;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.code==='KeyR'&&running)restart()});addEventListener('keyup',e=>keys[e.code]=false);
let yaw=0,pitch=0,locked=false;canvas.addEventListener('click',()=>{if(!locked)canvas.requestPointerLock()});document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;document.getElementById('hint').style.display=locked?'none':'block'});document.addEventListener('mousemove',e=>{if(locked){yaw+=e.movementX*.0026;pitch=Math.max(-.85,Math.min(.85,pitch-e.movementY*.0026))}});
const PH=1.2,GRAVITY=24,JUMP=8.4,GROUND_ACCEL=45,AIR_ACCEL=12,GROUND_MAX=7.2,AIR_MAX=45,FRICTION=7;
const player={x:0,z:0,y:PH,vx:0,vy:0,vz:0,onGround:true};
const platforms=[{x:0,z:-4,w:12,d:12,h:0},{x:0,z:-16,w:8,d:7,h:0},{x:4,z:-25,w:8,d:7,h:0},{x:10,z:-34,w:9,d:7,h:0},{x:16,z:-43,w:9,d:7,h:1},{x:10,z:-53,w:8,d:7,h:2},{x:3,z:-63,w:8,d:7,h:1},{x:-5,z:-73,w:9,d:7,h:0},{x:-14,z:-83,w:9,d:7,h:0},{x:-22,z:-94,w:9,d:7,h:1},{x:-14,z:-105,w:8,d:7,h:2},{x:-5,z:-116,w:8,d:7,h:2},{x:4,z:-127,w:9,d:7,h:1},{x:13,z:-138,w:10,d:8,h:0},{x:13,z:-150,w:12,d:12,h:0}];
let running=false,finished=false,startTime=0,best=Number(localStorage.getItem('csBhopBest')||0);
function setStart(){Object.assign(player,{x:0,z:0,y:PH,vx:0,vy:0,vz:0,onGround:true});yaw=0;pitch=0}
function start(){setStart();running=true;finished=false;startTime=performance.now();document.getElementById('menu').style.display='none';document.getElementById('finish').style.display='none';canvas.requestPointerLock()}
function restart(){start()}
function groundAt(x,z){let g=-999;for(const p of platforms)if(x>=p.x-p.w/2&&x<=p.x+p.w/2&&z>=p.z-p.d/2&&z<=p.z+p.d/2)g=Math.max(g,p.h);return g}
function wish(f,s){const len=Math.hypot(f,s);if(!len)return[0,0];f/=len;s/=len;const sy=Math.sin(yaw),cy=Math.cos(yaw);return[f*sy+s*cy,f*cy-s*sy]}
function accelerate(vx,vz,wx,wz,accel,dt,maxSpeed){const current=vx*wx+vz*wz;const amount=Math.min(accel*dt,Math.max(0,maxSpeed-current));return[vx+wx*amount,vz+wz*amount]}
function physics(dt){if(!running)return;const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),[wx,wz]=wish(f,s);
if(player.onGround){const sp=Math.hypot(player.vx,player.vz);if(sp>0){const ns=Math.max(0,sp-FRICTION*dt);player.vx*=ns/sp;player.vz*=ns/sp}if(f||s)[player.vx,player.vz]=accelerate(player.vx,player.vz,wx,wz,GROUND_ACCEL,dt,GROUND_MAX);if(keys.Space){player.vy=JUMP;player.onGround=false}}else{if(f||s)[player.vx,player.vz]=accelerate(player.vx,player.vz,wx,wz,AIR_ACCEL,dt,AIR_MAX);player.vy-=GRAVITY*dt}
const oldY=player.y;player.x+=player.vx*dt;player.z+=player.vz*dt;player.y+=player.vy*dt;const g=groundAt(player.x,player.z);
if(g>-999&&oldY>=g+PH-0.05&&player.y<=g+PH&&player.vy<=0){player.y=g+PH;player.vy=0;player.onGround=true}else player.onGround=false;
if(player.y<-8){setStart();return}if(player.z<-155&&player.y<5)finish()}
function finish(){running=false;finished=true;const t=(performance.now()-startTime)/1000;if(!best||t<best){best=t;localStorage.setItem('csBhopBest',best)}document.getElementById('finishText').textContent='Time: '+t.toFixed(2)+'s · Best: '+best.toFixed(2)+'s';document.getElementById('finish').style.display='flex';if(document.pointerLockElement)document.exitPointerLock()}
function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H*.58);sky.addColorStop(0,'#0b131e');sky.addColorStop(1,'#35434e');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const horizon=H*.52+pitch*H*.22;ctx.fillStyle='#1e252a';ctx.fillRect(0,horizon,W,H-horizon);
const fov=Math.PI/3,focal=W/(2*Math.tan(fov/2)),objects=[],sy=Math.sin(-yaw),cy=Math.cos(-yaw);
for(const p of platforms){const dx=p.x-player.x,dz=p.z-player.z,x=dx*cy-dz*sy,z=dx*sy+dz*cy;if(z<=.4||z>120)continue;const scale=focal/z,sx=W/2+x*scale,l=sx-p.w*scale/2,r=sx+p.w*scale/2,top=horizon-(p.h-player.y+PH)*scale,bot=top+p.d*scale;objects.push({z,l,r,top,bot,scale})}
objects.sort((a,b)=>b.z-a.z);for(const o of objects){if(o.r<0||o.l>W)continue;ctx.fillStyle='#69727a';ctx.fillRect(o.l,o.top,o.r-o.l,o.bot-o.top);ctx.fillStyle='#a9b0b5';ctx.fillRect(o.l,o.top,o.r-o.l,Math.max(2,o.scale*.1));ctx.fillStyle='#30373d';ctx.fillRect(o.l,o.top,o.r-o.l,Math.max(2,o.scale*.16));ctx.strokeStyle='#111';ctx.strokeRect(o.l,o.top,o.r-o.l,o.bot-o.top)}
const sp=Math.hypot(player.vx,player.vz);if(sp>10){ctx.globalAlpha=Math.min(.22,(sp-10)/50);ctx.strokeStyle='#fff';for(let i=0;i<12;i++){const x=W/2+(Math.random()-.5)*W;ctx.beginPath();ctx.moveTo(W/2+(x-W/2)*.15,H/2);ctx.lineTo(x,H/2+(Math.random()-.5)*H);ctx.stroke()}ctx.globalAlpha=1}
document.getElementById('speed').textContent=Math.round(sp*20)+' u/s';document.getElementById('timer').textContent=running?((performance.now()-startTime)/1000).toFixed(2):'0.00';document.getElementById('best').textContent=best?'BEST '+best.toFixed(2)+'s':''}
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;let last=performance.now();function loop(now){const dt=Math.min(.025,(now-last)/1000);last=now;physics(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
